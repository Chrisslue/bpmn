import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent


plugins {
    id "maven-publish"
    id "io.github.themrmilchmann.ecj" version "0.2.0" apply false
    id "com.github.sherter.google-java-format" version "0.9"    // Task "verifyGoogleJavaFormat" and "googleJavaFormat"
}

description = "BPMN-DSL"

allprojects {
    group 'de.monticore'
    buildDir = "$projectDir/target"

    repositories {
        if (("true").equals(getProperty('useLocalRepo'))) {
            mavenLocal()
        }
        maven {
            credentials.username mavenUser
            credentials.password mavenPassword
            url repo
        }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.github.themrmilchmann.ecj'
    apply plugin: 'maven-publish'

    tasks.withType(Test) {
        useJUnit()
        testLogging {
            // controls whether test output is shown
            showStandardStreams = ("false").equals(getProperty('showTestOutput')) ? false : true
            showExceptions true
            showCauses true
            showStackTraces true
            exceptionFormat TestExceptionFormat.FULL
            info {
                events TestLogEvent.FAILED,
                        TestLogEvent.PASSED,
                        TestLogEvent.SKIPPED,
                        TestLogEvent.STANDARD_OUT
            }
        }
        afterTest { desc, result ->
            logger.lifecycle "${desc.className} > ${desc.name} ${result.resultType}"
        }
        afterSuite { desc, result ->
            if (!desc.parent) { // will match the outermost suite
                def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
                def startItem = '|  ', endItem = '  |'
                logger.lifecycle startItem + output + endItem
            }
        }
        reports {
            junitXml.enabled = false
            html.enabled = false
        }
    }

    tasks.withType(JavaCompile) {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        options.encoding = "UTF-8"
        options.deprecation false
        options.warnings = false
        options.forkOptions.jvmArgs += ["-Xmx4G"]
        // TODO: reevaluate with new ecj plugin
        outputs.cacheIf { false } // ECJ has problem with caching
    }
}

googleJavaFormat {
    exclude '**/target/**'
}

verifyGoogleJavaFormat {
    ignoreFailures true
    exclude "**"
}  // do not check format in "build"

/**
 * Builds the whole BPMN project
 * Executes JUnit tests and assembles the jars
 */
task buildBPMN {
    group("build")
    description("Builds the whole BPMN project, i.e. BpmnXML, TimerConditions, WorkflowCLI and WorkflowDSL")
    dependsOn(
            ":BpmnXML:build",
//            ":TimerConditions:build",
//            ":WorkflowCLI:build",
            ":WorkflowDSL:build",
            gradle.includedBuilds*.task(":build")
    )
}

/**
 * Executes JUnit tests for the BPMN project
 */
task testBPMN {
    group("verification")
    description("Tests the JUnit Tests in the BPMN project")
    dependsOn(
            ":BpmnXML:test",
//            ":TimerConditions:test",
//            ":WorkflowCLI:test",
            ":WorkflowDSL:test",
            gradle.includedBuilds*.task(":test")
    )
}

/**
 *  Publishes the jars of the BPMN projects to the nexus repository.
 *  Assembles the jars and publishes them, but does not execute JUnit tests.
 */
task publishBPMN {
    group("publishing")
    description('Publishes the BPMN projects')

    dependsOn(
            ":BpmnXML:publish",
//            ":TimerConditions:publish",
//            ":WorkflowCLI:publish",
            ":WorkflowDSL:publish",
            gradle.includedBuilds*.task(":publish")
    )
}

/**
 *  Publishes the jars of the BPMN project
 *  to the local m2 repository. Typically this should not be needed.
 *  Assembles the jars and publishes them, but does not execute JUnit tests.
 */
task publishBPMNToMavenLocal {
    group("publishing")
    description('Publishes the BPMN projects' +
            'to the local maven repository.')
    dependsOn(
            ":BpmnXML:publishToMavenLocal",
//            ":TimerConditions:publishToMavenLocal",
//            ":WorkflowCLI:publishToMavenLocal",
            ":WorkflowDSL:publishToMavenLocal",
            gradle.includedBuilds*.task(':publishToMavenLocal')
    )
}

task buildAll(type: GradleBuild) {
    dependsOn(subprojects.collect { getTasksByName("build", false) })
}

task cleanBPMN {
    group("build")
    dependsOn(
            ":BpmnXML:clean",
//            ":TimerConditions:clean",
//            ":WorkflowCLI:clean",
            ":WorkflowDSL:clean"

    )
}

configure([
        project(':BpmnXML'),
         //  project(':TimerConditions'),
         //  project(':WorkflowCLI'),
           project(':WorkflowDSL')
]){
    apply plugin: 'maven-publish'

    // configure deployment
    publishing {
        publications {
            maven(MavenPublication) {
                from(components.java)
            }
        }
