pluginManagement {
    repositories {
        mavenCentral()
        if(("true").equals(getProperty('useLocalRepo'))){
            mavenLocal()
        }
        maven {
            credentials.username mavenUser
            credentials.password mavenPassword
            url repo
        }

        gradlePluginPortal()
    }
}

rootProject.name="BPMN"
include(':BpmnXML')
include(':TimerConditions')
include(':WorkflowCLI')
include(':WorkflowDSL')
include(':Workflow2SMT')
include(':WorkflowConformance')


