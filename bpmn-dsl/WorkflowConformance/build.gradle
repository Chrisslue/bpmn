plugins {
    id 'java'
}

group = 'com.monticore.workflowConformance'
version = '7.6.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':WorkflowDSL')
    implementation project(':TimeExpressions')
    implementation project(':Workflow2SMT')

        implementation 'org.jgrapht:jgrapht-core:1.5.2'
        implementation 'org.tinyjee.jgraphx:jgraphx:3.4.1.3'
        implementation 'org.jgrapht:jgrapht-ext:1.5.2'

    implementation project(":WorkflowDSL")
    implementation group: 'de.monticore', name: 'monticore-runtime', version: mc_version
    implementation "de.monticore:monticore-grammar:$mc_version"
    implementation "de.monticore.lang:ocl:$ocl_version"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'

}

test {
    useJUnitPlatform()
}