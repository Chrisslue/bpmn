image: registry.git.rwth-aachen.de/monticore/container-registry/gradle:7-native-image

variables:
  GRADLE_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2"
stages:
  - build
  - deploy

build:
  stage: build
  script:
    - "gradle --version"
    - "(cd ./bpmn-dsl && gradle build --refresh-dependencies -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1)"
    
deployToNexus:
  stage: deploy
  script:
    - "gradle --version"
    - "(cd ./bpmn-dsl && gradle WorkflowDSL:publish -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1)"
    - "(cd ./bpmn-dsl && gradle TimeExpressions:publish -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1)"
  only:
    - dev  